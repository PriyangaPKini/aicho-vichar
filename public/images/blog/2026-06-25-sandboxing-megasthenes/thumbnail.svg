<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sandboxing Megasthenes">
  <defs>
    <marker id="s-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d49423" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="s-maroon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b2c2c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .kicker { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.18em; }
      .title  { font-family: Fraunces, Charter, Georgia, serif; font-size: 46px; font-weight: 600; }
      .title-em { font-family: Fraunces, Charter, Georgia, serif; font-size: 46px; font-weight: 600; font-style: italic; }
      .byline { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.14em; }
      .node   { font-family: Charter, Georgia, serif; font-size: 17px; font-weight: 700; }
      .note   { font-family: Charter, Georgia, serif; font-size: 13px; font-style: italic; }
      .tag    { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#faf6ec"/>
  <rect x="26" y="26" width="1148" height="578" rx="18" fill="none" stroke="#d8ccb4" stroke-width="1.5"/>

  <!-- ── Illustration: host, sandbox wall, agent inside ── -->
  <g>
    <!-- client on the host -->
    <text class="tag" x="96" y="82" fill="#6b6258">HOST</text>
    <rect x="96" y="128" width="180" height="88" rx="6" fill="#f5efe1" stroke="#1a1a1a" stroke-width="1.3"/>
    <text class="node" x="186" y="166" text-anchor="middle" fill="#1a1a1a">Client</text>
    <text class="note" x="186" y="190" text-anchor="middle" fill="#6b6258">runs the LLM loop</text>

    <!-- the one allowed channel -->
    <path d="M276 172 H 386" fill="none" stroke="#d49423" stroke-width="2.4" marker-end="url(#s-gold)"/>
    <text class="note" x="330" y="158" text-anchor="middle" fill="#d49423">HTTP</text>

    <!-- host filesystem + secrets, denied -->
    <rect x="96" y="248" width="180" height="76" rx="6" fill="#faf6ec" stroke="#d8ccb4" stroke-width="1.3"/>
    <text class="node" x="186" y="280" text-anchor="middle" fill="#6b6258">Host FS</text>
    <text class="note" x="186" y="302" text-anchor="middle" fill="#6b6258">secrets, processes</text>
    <path d="M276 286 H 380" fill="none" stroke="#8b2c2c" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#s-maroon)"/>
    <path d="M314 268 l 30 30 M344 268 l -30 30" stroke="#8b2c2c" stroke-width="3.4" stroke-linecap="round"/>

    <!-- the sandbox wall -->
    <rect x="398" y="72" width="480" height="266" rx="14" fill="#f3ecdb" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="9 7"/>
    <text class="tag" x="422" y="102" fill="#1a1a1a">CONTAINER</text>

    <!-- worker inside -->
    <rect x="424" y="122" width="188" height="80" rx="6" fill="#faf6ec" stroke="#1a1a1a" stroke-width="1.3"/>
    <text class="node" x="518" y="156" text-anchor="middle" fill="#1a1a1a">Worker</text>
    <text class="note" x="518" y="180" text-anchor="middle" fill="#6b6258">constrained HTTP API</text>

    <path d="M518 202 V 236" fill="none" stroke="#d49423" stroke-width="2.2" marker-end="url(#s-gold)"/>

    <!-- agent + repo inside -->
    <rect x="424" y="244" width="188" height="76" rx="6" fill="#faf6ec" stroke="#d49423" stroke-width="1.7"/>
    <circle cx="456" cy="282" r="13" fill="none" stroke="#d49423" stroke-width="2"/>
    <circle cx="451" cy="279" r="2.4" fill="#d49423"/>
    <circle cx="461" cy="279" r="2.4" fill="#d49423"/>
    <path d="M450 288 h 12" stroke="#d49423" stroke-width="2" stroke-linecap="round"/>
    <text class="node" x="536" y="278" text-anchor="middle" fill="#1a1a1a">Agent</text>
    <text class="note" x="536" y="298" text-anchor="middle" fill="#6b6258">tools run here</text>

    <path d="M612 282 H 654" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>

    <!-- cloned repo, inside the box -->
    <rect x="662" y="244" width="188" height="76" rx="6" fill="#faf6ec" stroke="#1a1a1a" stroke-width="1.3"/>
    <path d="M676 272 h 14 l 5 6 h 17 v 18 h -36 z" fill="#f3ecdb" stroke="#6b6258" stroke-width="1.2" stroke-linejoin="round"/>
    <text class="node" x="786" y="278" text-anchor="middle" fill="#1a1a1a">Cloned repo</text>
    <text class="note" x="786" y="300" text-anchor="middle" fill="#6b6258">read-only to the host</text>

    <rect x="662" y="122" width="188" height="80" rx="6" fill="#faf6ec" stroke="#1a1a1a" stroke-width="1.3"/>
    <text class="node" x="756" y="156" text-anchor="middle" fill="#1a1a1a">git history</text>
    <text class="note" x="756" y="180" text-anchor="middle" fill="#6b6258">search the tree</text>

    <!-- network denied at the wall -->
    <path d="M878 172 H 964" fill="none" stroke="#8b2c2c" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#s-maroon)"/>
    <path d="M902 154 l 30 30 M932 154 l -30 30" stroke="#8b2c2c" stroke-width="3.4" stroke-linecap="round"/>

    <g transform="translate(978, 132)">
      <path d="M34 62 a 26 26 0 0 1 2 -50 a 32 32 0 0 1 58 12 a 22 22 0 0 1 -4 43 z" fill="#faf6ec" stroke="#8b2c2c" stroke-width="1.6" stroke-linejoin="round"/>
      <text class="note" x="62" y="46" text-anchor="middle" fill="#8b2c2c">network</text>
    </g>
    <text class="note" x="1040" y="228" text-anchor="middle" fill="#8b2c2c">no egress during tool execution</text>
  </g>

  <line x1="96" y1="376" x2="1104" y2="376" stroke="#d8ccb4" stroke-width="1.5"/>

  <!-- ── Type ── -->
  <text class="title"    x="96" y="486" fill="#1a1a1a">Sandboxing <tspan class="title-em" fill="#d49423">Megasthenes</tspan></text>
  <text class="byline" x="96" y="538" fill="#6b6258">PRIYANGA P KINI</text>
</svg>
