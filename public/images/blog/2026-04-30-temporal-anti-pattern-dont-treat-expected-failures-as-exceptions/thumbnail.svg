<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Temporal anti-pattern: don't treat expected failures as exceptions">
  <defs>
    <marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d49423" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-maroon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b2c2c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .kicker { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.18em; }
      .title  { font-family: Fraunces, Charter, Georgia, serif; font-size: 46px; font-weight: 600; }
      .title-em { font-family: Fraunces, Charter, Georgia, serif; font-size: 46px; font-weight: 600; font-style: italic; }
      .byline { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.14em; }
      .node   { font-family: Charter, Georgia, serif; font-size: 17px; font-weight: 700; }
      .note   { font-family: Charter, Georgia, serif; font-size: 13px; font-style: italic; }
      .tag    { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#faf6ec"/>
  <rect x="26" y="26" width="1148" height="578" rx="18" fill="none" stroke="#d8ccb4" stroke-width="1.5"/>

  <!-- ── Illustration: one activity, two ways out ── -->
  <g>
    <!-- source activity -->
    <rect x="96" y="152" width="212" height="76" rx="6" fill="#f5efe1" stroke="#1a1a1a" stroke-width="1.3"/>
    <text class="node" x="202" y="184" text-anchor="middle" fill="#1a1a1a">validateDocument()</text>
    <text class="note" x="202" y="208" text-anchor="middle" fill="#6b6258">the document is rejected</text>

    <!-- fork -->
    <path d="M308 190 H 366" fill="none" stroke="#d8ccb4" stroke-width="1.6"/>
    <circle cx="374" cy="190" r="7" fill="#faf6ec" stroke="#1a1a1a" stroke-width="1.4"/>

    <!-- upper path: exception (wrong) -->
    <path d="M381 186 C 430 150, 452 132, 500 128" fill="none" stroke="#8b2c2c" stroke-width="2.2"/>
    <path d="M500 128 l 26 -18 l 4 30 l 26 -20 l 6 30 l 24 -16" fill="none" stroke="#8b2c2c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M586 118 H 636" fill="none" stroke="#8b2c2c" stroke-width="2.2" marker-end="url(#a-maroon)"/>
    <text class="tag" x="470" y="92" fill="#8b2c2c">THROWN</text>

    <rect x="648" y="86" width="196" height="70" rx="6" fill="#faf6ec" stroke="#8b2c2c" stroke-width="1.5"/>
    <text class="node" x="746" y="116" text-anchor="middle" fill="#8b2c2c">Exception</text>
    <text class="note" x="746" y="138" text-anchor="middle" fill="#8b2c2c">reads as a system fault</text>

    <path d="M844 121 H 892" fill="none" stroke="#8b2c2c" stroke-width="2.2" marker-end="url(#a-maroon)"/>

    <!-- retry churn -->
    <circle cx="972" cy="121" r="46" fill="none" stroke="#8b2c2c" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M1005 89 l 14 -3 l -3 15" fill="none" stroke="#8b2c2c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="node" x="972" y="127" text-anchor="middle" fill="#8b2c2c">retried</text>
    <text class="note" x="972" y="192" text-anchor="middle" fill="#8b2c2c">until it gives up</text>
    <path d="M1042 96 l 34 34 M1076 96 l -34 34" stroke="#8b2c2c" stroke-width="3.2" stroke-linecap="round"/>

    <!-- lower path: outcome (right) -->
    <path d="M381 195 C 430 232, 452 250, 500 254" fill="none" stroke="#d49423" stroke-width="2.4"/>
    <path d="M500 254 H 636" fill="none" stroke="#d49423" stroke-width="2.4" marker-end="url(#a-gold)"/>
    <text class="tag" x="470" y="288" fill="#d49423">RETURNED</text>

    <rect x="648" y="220" width="196" height="70" rx="6" fill="#faf6ec" stroke="#d49423" stroke-width="1.7"/>
    <text class="node" x="746" y="250" text-anchor="middle" fill="#d49423">Result.Rejected</text>
    <text class="note" x="746" y="272" text-anchor="middle" fill="#6b6258">an expected outcome</text>

    <path d="M844 255 H 892" fill="none" stroke="#d49423" stroke-width="2.4" marker-end="url(#a-gold)"/>

    <rect x="900" y="220" width="180" height="70" rx="6" fill="#f5efe1" stroke="#1a1a1a" stroke-width="1.3"/>
    <path d="M924 254 l 11 12 l 22 -25" fill="none" stroke="#d49423" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="node" x="1008" y="250" text-anchor="middle" fill="#1a1a1a">handled</text>
    <text class="note" x="1008" y="272" text-anchor="middle" fill="#6b6258">workflow carries on</text>
  </g>

  <line x1="96" y1="352" x2="1104" y2="352" stroke="#d8ccb4" stroke-width="1.5"/>

  <!-- ── Type ── -->
  <text class="title"    x="96" y="445" fill="#1a1a1a">Temporal anti-pattern:</text>
  <text class="title-em" x="96" y="499" fill="#d49423">don&#8217;t treat expected failures as exceptions</text>
  <text class="byline" x="96" y="551" fill="#6b6258">PRIYANGA P KINI</text>
</svg>
